# GreenBulk — Nginx reverse proxy + TLS termination.
# Obtain certs with: certbot --nginx -d greenbulk.example -d www.greenbulk.example

# Rate-limit auth/login at the edge as defense-in-depth (app also limits).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

upstream greenbulk_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name greenbulk.example www.greenbulk.example;
    # Allow ACME challenge, redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name greenbulk.example www.greenbulk.example;

    ssl_certificate     /etc/letsencrypt/live/greenbulk.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greenbulk.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 25m;       # product image uploads
    add_header X-Content-Type-Options nosniff always;

    # Stripe webhook needs the raw body; never buffer or rewrite it.
    location /webhooks/stripe {
        proxy_pass http://greenbulk_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location /auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://greenbulk_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/greenbulk/app/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://greenbulk_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
