<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Super Siddur{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='siddur.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">The Super <b>Siddur</b></a>
    {% block crumbs %}{% endblock %}
  </header>
  <main class="stage">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot"><span>Server-rendered · readable URLs</span></footer>
</body>
</html>
