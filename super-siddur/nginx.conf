# The Super Siddur — nginx reverse proxy (TLS termination + static caching).
# Drop into /etc/nginx/sites-available/super-siddur and symlink into sites-enabled.
# Obtain certs with: certbot --nginx -d siddur.example.com

server {
    listen 80;
    server_name siddur.example.com;
    # Redirect everything to HTTPS (certbot manages the 443 block / cert paths).
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name siddur.example.com;

    ssl_certificate     /etc/letsencrypt/live/siddur.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siddur.example.com/privkey.pem;

    # Security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 16m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache immutable static assets; the service worker handles freshness.
    location ~* \.(css|js|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
