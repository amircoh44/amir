{% extends "admin/base.html" %}
{% block nav %}dashboard{% endblock %}
{% block content %}
<div class="admin-head"><h1 class="glow">Dashboard</h1></div>

<div class="stats" id="stats"><div class="stat"><div class="label">Loading…</div></div></div>

<div class="form-grid">
  <div>
    <h3>Top products (paid, all-time)</h3>
    <table class="table">
      <thead><tr><th>Product</th><th>Units</th><th>Revenue</th></tr></thead>
      <tbody id="top-products"><tr><td colspan="3" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
  <div>
    <h3>Top customers (paid, all-time)</h3>
    <table class="table">
      <thead><tr><th>Customer</th><th>Orders</th><th>Spent</th></tr></thead>
      <tbody id="top-customers"><tr><td colspan="3" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
</div>
{% endblock %}
