{% extends "admin/base.html" %}
{% block nav %}customers{% endblock %}
{% block content %}
<div class="admin-head"><h1 class="glow">Customers</h1></div>
<p class="muted">Approve verified businesses to unlock purchasing (compliance gate).</p>

<table class="table">
  <thead>
    <tr><th>Business</th><th>State</th><th>Role</th><th>Verification</th><th>Globe</th><th>Action</th></tr>
  </thead>
  <tbody id="customers-rows"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
</table>

<dialog class="modal" id="showcase-modal">
  <h3 class="glow">Edit globe showcase</h3>
  <p class="muted" id="sc-subtitle"></p>
  <form id="showcase-edit-form" method="dialog">
    <input type="hidden" name="id">
    <div class="field">
      <label><input type="checkbox" name="show_on_map" style="width:auto;min-width:auto"> Show on public customer globe</label>
    </div>
    <div class="field"><label>Business name</label><input name="business_name"></div>
    <div class="field"><label>Website</label><input name="website" placeholder="example.com"></div>
    <div class="field"><label>Street address</label><input name="street_address"></div>
    <div class="form-grid">
      <div class="field"><label>City</label><input name="city"></div>
      <div class="field"><label>State</label><input name="state" maxlength="2"></div>
    </div>
    <div class="field"><label>Public description</label><textarea name="public_info" rows="3" maxlength="2000"></textarea></div>
    <p class="coords-note" id="sc-coords"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="sc-cancel">Cancel</button>
      <button type="submit" class="btn btn-primary">Save &amp; geocode</button>
    </div>
  </form>
</dialog>
{% endblock %}
