{% extends "base.html" %}
{% block title %}Catalog — {{ settings.app_name }}{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <p class="eyebrow">Wholesale catalog</p>
    <h2>Browse product</h2>

    <form id="filters" class="filters" onsubmit="return false">
      <div class="field">
        <label>Search</label>
        <input type="text" name="search" placeholder="Strain or name">
      </div>
      <div class="field">
        <label>Type</label>
        <select name="product_type">
          <option value="">All types</option>
          <option value="flower">Flower</option>
          <option value="pre_roll">Pre-roll</option>
          <option value="concentrate">Concentrate</option>
          <option value="edible">Edible</option>
          <option value="vape">Vape</option>
          <option value="tincture">Tincture</option>
          <option value="topical">Topical</option>
          <option value="isolate">Isolate</option>
          <option value="biomass">Biomass</option>
        </select>
      </div>
      <div class="field">
        <label>Min THC %</label>
        <input type="number" name="min_thc" min="0" max="100" step="0.5">
      </div>
      <div class="field">
        <label>Min CBD %</label>
        <input type="number" name="min_cbd" min="0" max="100" step="0.5">
      </div>
      <div class="field">
        <label>Sort by</label>
        <select name="sort">
          <option value="newest">Newest</option>
          <option value="price">Price</option>
          <option value="thc">THC %</option>
          <option value="cbd">CBD %</option>
          <option value="name">Name</option>
        </select>
      </div>
      <div class="field">
        <label>In stock</label>
        <select name="in_stock_only"><option value="">Any</option><option value="true">In stock</option></select>
      </div>
    </form>

    <div id="catalog-grid" class="grid"></div>
  </div>
</section>
{% endblock %}
